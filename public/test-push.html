<!DOCTYPE html>
<html>
<head>
    <title>Push Notification Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1c1917; color: #fafaf9; }
        button { padding: 10px 20px; margin: 5px; background: #f59e0b; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #d97706; }
        .log { background: #292524; padding: 15px; border-radius: 8px; margin: 10px 0; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .log-entry { margin: 5px 0; padding: 5px; border-left: 3px solid #f59e0b; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
    </style>
</head>
<body>
    <h1>🔔 Push Notification Test</h1>
    
    <div>
        <button onclick="checkStatus()">1. Check Status</button>
        <button onclick="requestPermission()">2. Request Permission</button>
        <button onclick="testNotification()">3. Test Notification</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div id="log" class="log"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js';

        const log = (msg, type = 'info') => {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
            console.log(msg);
        };

        window.clearLog = () => {
            document.getElementById('log').innerHTML = '';
        };

        window.checkStatus = async () => {
            log('=== Checking Status ===');
            
            // Check notification support
            if (!('Notification' in window)) {
                log('❌ Notifications not supported', 'error');
                return;
            }
            log('✅ Notifications supported', 'success');
            
            // Check permission
            log(`Permission: ${Notification.permission}`, Notification.permission === 'granted' ? 'success' : 'warning');
            
            // Check service worker
            if (!('serviceWorker' in navigator)) {
                log('❌ Service Workers not supported', 'error');
                return;
            }
            log('✅ Service Workers supported', 'success');
            
            const regs = await navigator.serviceWorker.getRegistrations();
            log(`Service Workers registered: ${regs.length}`);
            regs.forEach((reg, i) => {
                log(`  SW ${i+1}: ${reg.active?.state} - ${reg.active?.scriptURL}`);
            });
            
            // Check if controlling
            if (navigator.serviceWorker.controller) {
                log('✅ Service worker is controlling page', 'success');
            } else {
                log('⚠️ Service worker NOT controlling page', 'warning');
            }
        };

        window.requestPermission = async () => {
            log('=== Requesting Permission ===');
            
            try {
                const permission = await Notification.requestPermission();
                log(`Permission result: ${permission}`, permission === 'granted' ? 'success' : 'error');
                
                if (permission !== 'granted') {
                    return;
                }
                
                // Register service worker
                log('Registering service worker...');
                const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js?v=' + Date.now());
                log('✅ Service worker registered', 'success');
                
                await navigator.serviceWorker.ready;
                log('✅ Service worker ready', 'success');
                
                // Initialize Firebase (you need to add your config here)
                log('⚠️ Firebase initialization skipped - add your config to this file', 'warning');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        };

        window.testNotification = async () => {
            log('=== Testing Notification ===');
            
            if (Notification.permission !== 'granted') {
                log('❌ Permission not granted', 'error');
                return;
            }
            
            try {
                const registration = await navigator.serviceWorker.ready;
                
                await registration.showNotification('Test Notification', {
                    body: 'This is a test notification from the service worker',
                    icon: '/zenith.png',
                    badge: '/zenith.png',
                    tag: 'test',
                    requireInteraction: true,
                    vibrate: [200, 100, 200],
                    actions: [
                        { action: 'open', title: 'Open' },
                        { action: 'close', title: 'Close' }
                    ]
                });
                
                log('✅ Notification shown successfully!', 'success');
                log('If you see the notification, service worker is working!', 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        };

        // Auto-check on load
        window.addEventListener('load', () => {
            log('Test page loaded');
            checkStatus();
        });
    </script>
</body>
</html>
