<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/zenith.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <meta name="description"
    content="Zenith - Level up your team's skills with task management, quizzes, and gamified learning" />
  <meta name="theme-color" content="#6366f1" />
  <title>Zenith OS</title>
  <link rel="manifest" href="/manifest.json">
  
  <!-- Preconnect & Fonts Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Enterprise OpenGraph & Mobile Metadata -->
  <meta property="og:title" content="Zenith OS — Enterprise Skill & Sprint Platform" />

  <meta property="og:image" content="/zenith.png" />
  <meta property="og:type" content="website" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.bottom = '20px';
      errorDiv.style.left = '20px';
      errorDiv.style.right = '20px';
      errorDiv.style.padding = '20px';
      errorDiv.style.background = '#ef4444';
      errorDiv.style.color = 'white';
      errorDiv.style.borderRadius = '8px';
      errorDiv.style.zIndex = '999999';
      errorDiv.style.fontSize = '12px';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
      errorDiv.innerHTML = '<strong>App Crash Detected:</strong><br>' + msg + '<br>at ' + url + ':' + lineNo;
      document.body.appendChild(errorDiv);
      return false;
    };
  </script>

  <script type="text/javascript">

      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {})
          .catch(err => {});
      });

  </script>
