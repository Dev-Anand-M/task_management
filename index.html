<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />

    content="Zenith - Level up your team's skills with task management, quizzes, and gamified learning" />

  <link rel="manifest" href="/manifest.json">
    <script>
      // Global error handler to catch early crashes
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.bottom = '20px';
        errorDiv.style.left = '20px';
        errorDiv.style.right = '20px';
        errorDiv.style.padding = '20px';
        errorDiv.style.background = '#ef4444';
        errorDiv.style.color = 'white';
        errorDiv.style.borderRadius = '8px';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.fontSize = '12px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
        errorDiv.innerHTML = '<strong>App Crash Detected:</strong><br>' + msg + '<br>at ' + url + ':' + lineNo;
        document.body.appendChild(errorDiv);
        return false;
      };

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" onerror="console.error('OneSignal SDK failed to load! Check ad-blockers.')"></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.initOneSignal = function() {
        console.log("[OneSignal] Manually initializing...");
        window.OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.init({
            appId: "595cc111-feab-4d1c-8d80-fdbea3b564ec",
          });
          console.log("[OneSignal] Init complete");
        });
      };
      window.initOneSignal();
    </script>
