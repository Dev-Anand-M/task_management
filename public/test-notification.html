<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith - Notification Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1c1917;
            color: #fafaf9;
        }
        h1 { color: #f59e0b; }
        .section {
            background: #292524;
            border: 1px solid #57534e;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
        }
        button:hover { background: #d97706; }
        button:disabled {
            background: #57534e;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #065f46; color: #d1fae5; }
        .error { background: #7f1d1d; color: #fecaca; }
        .warning { background: #78350f; color: #fef3c7; }
        .info { background: #1e3a8a; color: #dbeafe; }
        pre {
            background: #1c1917;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .log {
            max-height: 300px;
            overflow-y: auto;
            background: #1c1917;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #f59e0b;
        }
    </style>
</head>
<body>
    <h1>🔔 Zenith Notification Diagnostic Tool</h1>
    
    <div class="section">
        <h2>1. Permission Status</h2>
        <div id="permissionStatus"></div>
        <button onclick="requestPermission()">Request Permission</button>
    </div>

    <div class="section">
        <h2>2. Service Worker Status</h2>
        <div id="swStatus"></div>
        <button onclick="checkServiceWorker()">Check Service Worker</button>
        <button onclick="unregisterAll()">Unregister All</button>
    </div>

    <div class="section">
        <h2>3. Test Notifications</h2>
        <button onclick="testBasicNotification()">Test Basic Notification</button>
        <button onclick="testRichNotification()">Test Rich Notification</button>
        <button onclick="testWithActions()">Test With Actions</button>
    </div>

    <div class="section">
        <h2>4. Browser Capabilities</h2>
        <div id="capabilities"></div>
        <button onclick="checkCapabilities()">Check Capabilities</button>
    </div>

    <div class="section">
        <h2>5. Activity Log</h2>
        <button onclick="clearLog()">Clear Log</button>
        <div id="log" class="log"></div>
    </div>

    <script>
        const log = (message, type = 'info') => {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.borderLeftColor = type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : '#f59e0b';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
        };

        const clearLog = () => {
            document.getElementById('log').innerHTML = '';
        };

        const showStatus = (elementId, message, type) => {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="status ${type}">${message}</div>`;
        };

        // Check permission
        const checkPermission = () => {
            const permission = Notification.permission;
            let type = 'info';
            let message = `Current permission: <strong>${permission}</strong>`;
            
            if (permission === 'granted') {
                type = 'success';
                message += ' ✅';
            } else if (permission === 'denied') {
                type = 'error';
                message += ' ❌ (User must manually enable in browser settings)';
            } else {
                type = 'warning';
                message += ' ⚠️ (Not yet requested)';
            }
            
            showStatus('permissionStatus', message, type);
            log(`Permission status: ${permission}`, permission === 'granted' ? 'success' : 'info');
        };

        const requestPermission = async () => {
            try {
                log('Requesting notification permission...');
                const permission = await Notification.requestPermission();
                log(`Permission result: ${permission}`, permission === 'granted' ? 'success' : 'error');
                checkPermission();
            } catch (error) {
                log(`Error requesting permission: ${error.message}`, 'error');
            }
        };

        // Check service worker
        const checkServiceWorker = async () => {
            try {
                log('Checking service worker status...');
                
                if (!('serviceWorker' in navigator)) {
                    showStatus('swStatus', 'Service Worker not supported in this browser ❌', 'error');
                    log('Service Worker not supported', 'error');
                    return;
                }

                const registrations = await navigator.serviceWorker.getRegistrations();
                
                if (registrations.length === 0) {
                    showStatus('swStatus', 'No service workers registered ⚠️', 'warning');
                    log('No service workers found', 'info');
                    return;
                }

                let html = '<div class="status success">Service Workers Found:</div><pre>';
                registrations.forEach((reg, i) => {
                    const state = reg.active?.state || 'unknown';
                    const url = reg.active?.scriptURL || 'unknown';
                    html += `\n${i + 1}. State: ${state}\n   URL: ${url}\n   Scope: ${reg.scope}`;
                    log(`SW ${i + 1}: ${state} - ${url}`);
                });
                html += '</pre>';
                
                showStatus('swStatus', html, 'success');
                
                // Check if controlling
                if (navigator.serviceWorker.controller) {
                    log('✅ Service worker is controlling this page', 'success');
                } else {
                    log('⚠️ Service worker is NOT controlling this page', 'error');
                }
            } catch (error) {
                showStatus('swStatus', `Error: ${error.message}`, 'error');
                log(`Error checking SW: ${error.message}`, 'error');
            }
        };

        const unregisterAll = async () => {
            try {
                log('Unregistering all service workers...');
                const registrations = await navigator.serviceWorker.getRegistrations();
                
                for (const reg of registrations) {
                    await reg.unregister();
                    log(`Unregistered: ${reg.scope}`, 'success');
                }
                
                showStatus('swStatus', `Unregistered ${registrations.length} service worker(s) ✅`, 'success');
                log('All service workers unregistered', 'success');
            } catch (error) {
                log(`Error unregistering: ${error.message}`, 'error');
            }
        };

        // Test notifications
        const testBasicNotification = async () => {
            if (Notification.permission !== 'granted') {
                alert('Please grant notification permission first');
                return;
            }

            try {
                log('Testing basic notification...');
                const registration = await navigator.serviceWorker.ready;
                
                await registration.showNotification('Basic Test', {
                    body: 'This is a basic notification test',
                    icon: '/zenith.png',
                    badge: '/zenith.png'
                });
                
                log('✅ Basic notification shown', 'success');
            } catch (error) {
                log(`❌ Error showing notification: ${error.message}`, 'error');
            }
        };

        const testRichNotification = async () => {
            if (Notification.permission !== 'granted') {
                alert('Please grant notification permission first');
                return;
            }

            try {
                log('Testing rich notification...');
                const registration = await navigator.serviceWorker.ready;
                
                await registration.showNotification('Rich Test', {
                    body: 'This notification has image, vibration, and sound',
                    icon: '/zenith.png',
                    badge: '/zenith.png',
                    image: '/zenith.png',
                    vibrate: [200, 100, 200],
                    silent: false,
                    requireInteraction: true,
                    timestamp: Date.now()
                });
                
                log('✅ Rich notification shown', 'success');
            } catch (error) {
                log(`❌ Error showing notification: ${error.message}`, 'error');
            }
        };

        const testWithActions = async () => {
            if (Notification.permission !== 'granted') {
                alert('Please grant notification permission first');
                return;
            }

            try {
                log('Testing notification with actions...');
                const registration = await navigator.serviceWorker.ready;
                
                await registration.showNotification('Action Test', {
                    body: 'This notification has action buttons',
                    icon: '/zenith.png',
                    badge: '/zenith.png',
                    image: '/zenith.png',
                    vibrate: [200, 100, 200],
                    requireInteraction: true,
                    actions: [
                        { action: 'open', title: 'Open' },
                        { action: 'close', title: 'Dismiss' }
                    ]
                });
                
                log('✅ Notification with actions shown', 'success');
            } catch (error) {
                log(`❌ Error showing notification: ${error.message}`, 'error');
            }
        };

        // Check capabilities
        const checkCapabilities = () => {
            log('Checking browser capabilities...');
            
            const capabilities = {
                'Notifications API': 'Notification' in window,
                'Service Worker': 'serviceWorker' in navigator,
                'Push API': 'PushManager' in window,
                'Notification.maxActions': Notification.maxActions || 'Unknown',
                'Vibration API': 'vibrate' in navigator,
                'Badge API': 'setAppBadge' in navigator,
                'User Agent': navigator.userAgent,
                'Platform': navigator.platform,
                'Online': navigator.onLine,
                'Cookie Enabled': navigator.cookieEnabled
            };

            let html = '<pre>';
            for (const [key, value] of Object.entries(capabilities)) {
                const supported = typeof value === 'boolean' ? (value ? '✅' : '❌') : '';
                html += `${key}: ${value} ${supported}\n`;
                log(`${key}: ${value}`);
            }
            html += '</pre>';

            showStatus('capabilities', html, 'info');
        };

        // Initialize
        window.addEventListener('load', () => {
            log('Diagnostic tool loaded');
            checkPermission();
            checkServiceWorker();
            checkCapabilities();
        });
    </script>
</body>
</html>
