<!DOCTYPE html>
<html>
<head>
    <title>OneSignal Quick Check</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            font-size: 14px;
        }
        .status { margin: 10px 0; padding: 10px; border: 1px solid #0f0; }
        .good { color: #0f0; }
        .bad { color: #f00; }
        .waiting { color: #ff0; }
    </style>
</head>
<body>
    <h1>OneSignal Quick Check</h1>
    <div id="status"></div>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        const log = (msg, className = 'waiting') => {
            const div = document.createElement('div');
            div.className = `status ${className}`;
            div.textContent = msg;
            document.getElementById('status').appendChild(div);
            console.log(msg);
        };

        log('⏳ Checking OneSignal SDK...', 'waiting');
        
        let checkCount = 0;
        const checkInterval = setInterval(() => {
            checkCount++;
            
            if (window.OneSignal) {
                clearInterval(checkInterval);
                log(`✅ OneSignal SDK loaded after ${checkCount} seconds`, 'good');
                log(`✅ window.OneSignal exists`, 'good');
                log(`✅ Browser permission: ${Notification.permission}`, 'good');
                
                window.OneSignalDeferred = window.OneSignalDeferred || [];
                window.OneSignalDeferred.push(async (OneSignal) => {
                    try {
                        await OneSignal.init({ appId: "595cc111-feab-4d1c-8d80-fdbea3b564ec" });
                        log(`✅ OneSignal initialized successfully`, 'good');
                        log(`✅ OneSignal.Notifications exists: ${!!OneSignal.Notifications}`, 'good');
                        log(`✅ Permission status: ${OneSignal.Notifications.permission}`, 'good');
                        log(`\n🎉 OneSignal is working! You can close this page.`, 'good');
                    } catch (err) {
                        log(`❌ Init failed: ${err.message}`, 'bad');
                    }
                });
            } else if (checkCount >= 10) {
                clearInterval(checkInterval);
                log(`❌ OneSignal SDK did NOT load after 10 seconds`, 'bad');
                log(`❌ This means:`, 'bad');
                log(`   1. Ad-blocker is blocking cdn.onesignal.com`, 'bad');
                log(`   2. Network/firewall issue`, 'bad');
                log(`   3. Browser extension blocking it`, 'bad');
                log(`\n🔧 Try:`, 'waiting');
                log(`   - Disable ad-blockers`, 'waiting');
                log(`   - Test in incognito mode`, 'waiting');
                log(`   - Try different browser`, 'waiting');
            }
        }, 1000);
    </script>
</body>
</html>
